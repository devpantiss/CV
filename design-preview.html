<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Valley · Light palette</title><style>:root{--color-primary:#286458;--color-primary-strong:#1d4d43;--color-primary-soft:#e7f0e9;--color-accent:#9b5037;--color-accent-soft:#f6e9df;--color-background:#f8f9f5;--color-surface:#ffffff;--color-surface-muted:#edf2eb;--color-card:#ffffff;--color-foreground:#203b33;--color-muted:#5c6e65;--color-border:#dce5dc;--color-success:#286448;--color-error:#ad3535;--shadow-sm:0 2px 6px rgb(32 59 51 / .03), 0 10px 28px rgb(32 59 51 / .04);--shadow-md:0 18px 48px rgb(32 59 51 / .09);--shadow-lg:0 30px 80px rgb(32 59 51 / .12);--radius-sm:0.75rem;--radius-md:1.25rem;--radius-lg:2rem;--color-on-primary:#ffffff;--color-info:#3a657f;--color-info-soft:#e9f0f6;--color-warning:#895e24;--color-warning-soft:#f7efdc;--color-error-soft:#fbeceb;--color-surface-glass:rgb(255 255 255 / .9);--color-overlay:rgb(32 59 51 / .5);--hero-wash:linear-gradient(100deg, rgb(248 249 245 / .98) 0%, rgb(248 249 245 / .94) 43%, rgb(237 242 235 / .78) 72%, rgb(246 233 223 / .56) 100%)}*{box-sizing:border-box}body{margin:0;background:var(--color-background);color:var(--color-foreground);font:16px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:48px 24px}img{width:240px;height:auto}h1{font-size:clamp(32px,5vw,52px);line-height:1.1;letter-spacing:-.04em}p{color:var(--color-muted);max-width:600px}.palette{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:32px 0}button{font:inherit;cursor:pointer;border:1px solid var(--color-border);border-radius:16px;background:var(--color-surface);padding:12px;text-align:left;color:var(--color-foreground)}button:focus-visible{outline:3px solid var(--color-primary);outline-offset:3px}.swatch{display:block;height:80px;border:1px solid var(--color-border);border-radius:8px;margin-bottom:12px}small{display:block;color:var(--color-muted)}.sample{border:1px solid var(--color-border);border-radius:24px;background:var(--color-primary-soft);padding:32px}.action{background:var(--color-primary);color:var(--color-on-primary);border-radius:100px;padding:12px 20px}output{display:block;min-height:28px;margin-top:12px;color:var(--color-accent)}</style><main><img src="public/career-valley-logo.png" alt="The Career Valley" width="891" height="232"><h1>A clearer way forward.</h1><p>Warm ivory, quiet sage and soft peach. Original green branding, deep readable ink, and restrained accents.</p><div class="palette"><button data-token="color-primary"><span class="swatch" style="background:var(--color-primary)"></span>primary<small>#286458</small></button><button data-token="color-primary-strong"><span class="swatch" style="background:var(--color-primary-strong)"></span>primary-strong<small>#1d4d43</small></button><button data-token="color-primary-soft"><span class="swatch" style="background:var(--color-primary-soft)"></span>primary-soft<small>#e7f0e9</small></button><button data-token="color-accent"><span class="swatch" style="background:var(--color-accent)"></span>accent<small>#9b5037</small></button><button data-token="color-accent-soft"><span class="swatch" style="background:var(--color-accent-soft)"></span>accent-soft<small>#f6e9df</small></button><button data-token="color-background"><span class="swatch" style="background:var(--color-background)"></span>background<small>#f8f9f5</small></button><button data-token="color-surface"><span class="swatch" style="background:var(--color-surface)"></span>surface<small>#ffffff</small></button><button data-token="color-surface-muted"><span class="swatch" style="background:var(--color-surface-muted)"></span>surface-muted<small>#edf2eb</small></button><button data-token="color-card"><span class="swatch" style="background:var(--color-card)"></span>card<small>#ffffff</small></button><button data-token="color-foreground"><span class="swatch" style="background:var(--color-foreground)"></span>foreground<small>#203b33</small></button><button data-token="color-muted"><span class="swatch" style="background:var(--color-muted)"></span>muted<small>#5c6e65</small></button><button data-token="color-border"><span class="swatch" style="background:var(--color-border)"></span>border<small>#dce5dc</small></button><button data-token="color-success"><span class="swatch" style="background:var(--color-success)"></span>success<small>#286448</small></button><button data-token="color-error"><span class="swatch" style="background:var(--color-error)"></span>error<small>#ad3535</small></button><button data-token="color-on-primary"><span class="swatch" style="background:var(--color-on-primary)"></span>on-primary<small>#ffffff</small></button><button data-token="color-info"><span class="swatch" style="background:var(--color-info)"></span>info<small>#3a657f</small></button><button data-token="color-info-soft"><span class="swatch" style="background:var(--color-info-soft)"></span>info-soft<small>#e9f0f6</small></button><button data-token="color-warning"><span class="swatch" style="background:var(--color-warning)"></span>warning<small>#895e24</small></button><button data-token="color-warning-soft"><span class="swatch" style="background:var(--color-warning-soft)"></span>warning-soft<small>#f7efdc</small></button><button data-token="color-error-soft"><span class="swatch" style="background:var(--color-error-soft)"></span>error-soft<small>#fbeceb</small></button></div><section class="sample"><h2>Your next step starts here.</h2><p>Thoughtful career and college guidance for students and families.</p><button class="action" id="preview-action">Preview focus and interaction →</button><output aria-live="polite" id="selection">Select a swatch to inspect its token.</output></section></main><script>document.querySelectorAll('[data-token]').forEach(button=>button.addEventListener('click',()=>{document.getElementById('selection').textContent='Selected token: var(--'+button.dataset.token+')'}));document.getElementById('preview-action').onclick=()=>document.getElementById('selection').textContent='Primary action · forest background with white text';</script></html>
